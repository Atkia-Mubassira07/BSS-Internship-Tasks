<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=\, initial-scale=1.0" />
    <title>HTML & CSS Sandbox</title>
  </head>
  <body>
    <h1>HTML & CSS Sandbox - Line Break, Horizontal Rule & Entities</h1>

    <!-- Line Breaks -->
        <p></p>Hello <br /><br /><br /> World</p>

    <!-- Horizontal Rule -->
    <p>This is the first paragraph</p>
    <hr />
    <p>This is the second paragraph</p>
    <br />
    <p>Copyright &copy; 2023</p>

    <!--Pre tag-->
    <pre>
        This is         a preformatted text.
        It preserves        whitespace 
              and line breaks.
    </pre>


    <!--Code Tag-->
    <code>
        &lt;h1&gt;This is a heading&lt;/h1&gt;
    </code>


    <!--HTML Entities-->
    <!--
    &lt; - Less than
    &gt; - Greater than
    &amp; - Ampersand
    &quot; - Quote
    &apos; - Apostrophe
    &copy; - Copyright
    &reg; - Registered Trademark 
    &trade; - Trademark
    &nbsp; - Non-breaking space 
    
    &cent; - Cent
    &pound; - Pound
    &yen; - Yen
    &euro; - Euro
    &sect; - Section
    &para; - Paragraph
    &deg; - Degree
    &plusmn; - Plus-minus
    &micro; - Micro
    &middot; - Middle dot
    &divide; - Division
    &times; - Multiplication
    -->

  </body>
</html>
