<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML & CSS Sandbox</title>
  </head>
  <body>
    <h1>Favourite Programming Languages</h1>

    <form>
      <lable for="html">
        <input type="checkbox" id="html" name="html" value="HTML" disabled />
        HTML
      </lable>

      <lable for="css">
        <input type="checkbox" id="css" name="css" value="CSS" checked />
        CSS
      </lable>

      <lable for="javascript">
        <input type="checkbox" id="javascript" name="javascript" value="Javascript" checked />
        JavaScript
      </lable>

    </form>

    <h2>Product Size</h2>

    <form>
        <label for="small">
            <input type="radio" id="small" name="size" value="small" />
            Small
        </label>
        <label for="medium">
            <input type="radio" id="medium" name="size" value="medium" cheched />
            Medium
        </label>
        <label for="large">
            <input type="radio" id="large" name="size" value="large" />
            Large
        </label>
    </form>
  </body>
</html>
