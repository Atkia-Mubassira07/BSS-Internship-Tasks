<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML & CSS Sandbox</title>
  </head>
  <body>

    <!-- Relative path -->
    <!-- <img src="images/landscape.jpg" alt="A beautiful landscape" /> -->

    <!-- Absolute path -->
    <!-- <img src="https://picsum.photos/200/300" alt="Random Image from Picsum" /> -->

    <!--Width and Height-->
    <img src="images/landscape.jpg" 
    alt="landscape" 
    width="400" 
    height="300"
    title="A beautiful landscape"
    />

    <!-- figure and figcaption -->
    <figure>
      <img src="images/landscape.jpg" 
      alt="landscape" 
      width="400" 
      height="300"
      title="A beautiful landscape"
      />
      <figcaption>A beautiful landscape</figcaption>
    </figure>

  </body>
</html>
