<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML & CSS Sandbox - Global Attributes</title>
  </head>
  <body>
    <h2 class="text-xl">Heading 1</h2>

    <h2 id="main-heading">Heading 2</h2>

    <p style="color: blue; font-size: 16px;">This is a paragraph.</p>

    <button title="Home Button" acceskey="h" oneclick="alert('Home button clciked')">Home</button>

    <div hidden>
        <p>This content is hidden.</p>
    </div>

    <button tableindex="3">Button 1</button>
    <button tableindex="1">Button 2</button>
    <button tableindex="2">Button 3</button>

    <div contenteditable="true">
        <p>This content is editable.</p>
    </div>

    <div draggable="true">
        <p>This content is draggable.</p>
    </div>

    <input type="text" autofocus />
  </body>
</html>
