<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <title>Bono App  |  Sign Up</title>
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <a href="index.html">
                <img class="logo" src="images/logo.svg" alt="Bono Logo">
            </a>
            <div class="header-right">
                <div><i class="fas fa-envelope"></i> contact@bono.com</div>
                <div><i class="fas fa-phone"></i> +1 234 567 890</div>
                <a href="#">
                    <i class="fa-brands fa-twitter"></i>
                </a>
            </header>

            <main class="main-content">
                <form>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">message</label>
                        <input type="message" id="message" name="message">
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn">Submit</button>
                    </div>
                </form>

                <div class="text-container">
                    <h1>Coming Soon For Every Development</h1>
                    <P>
                        Our new Bono web app will change the way you think about content management and will allow you to focus on what's really important. Use the contact from to send us your thoughts.
                    </P>
                </div>
            </main>
    </div>
</body>
</html>
